name: Build & Test Windows Application

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Unit, Vector Text-Edit & Qt GUI Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -v

      - name: Build Standalone Windows Executable
        run: |
          pyinstaller --noconfirm personal_pdf.spec
          mkdir dist-windows
          copy dist\Personal-PDF-Suite-Windows.exe dist-windows\Personal-PDF-Suite-Windows.exe

      - name: Upload Windows Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Personal-PDF-Suite-Windows
          path: dist-windows/
          if-no-files-found: error
